name: Release

on:
  push:
    tags:
      - "[0-9]*"

  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (e.g. 4.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    if: ${{ github.event_name == 'workflow_dispatch' || !endsWith(github.ref_name, '.x') }}
    runs-on: ubuntu-latest

    steps:
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="${INPUT_VERSION}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(RC[0-9]+)?$ ]]; then
            echo "::error::Invalid release version: $VERSION"
            exit 1
          fi

          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.version.outputs.value }}

      - name: Extract release notes
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: python3 ci/changelog.py extract "$VERSION" > release-notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          args=()

          if [[ "${VERSION}" =~ RC[0-9]+$ ]]; then
            args+=(--prerelease)
          fi

          gh release create "$VERSION" \
            --verify-tag \
            --title "$VERSION" \
            --notes-file release-notes.md \
            "${args[@]}"
